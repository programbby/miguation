name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shellcheck:
    name: Analyse statique (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Analyser les scripts shell
        env:
          # Sans locale UTF-8, shellcheck échoue sur les accents des commentaires.
          LC_ALL: C.UTF-8
        run: shellcheck -x -S warning miguation.sh scripts/*.sh scripts/lib/common.sh

  tests:
    name: Tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer bats et rsync
        run: sudo apt-get update && sudo apt-get install -y bats rsync

      - name: Lancer la suite de tests
        env:
          LC_ALL: C.UTF-8
        run: bats tests/

  python:
    name: Serveur de transfert (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Vérifier la syntaxe
        run: python3 -m py_compile scripts/lib/serveur.py

  powershell:
    name: Analyse statique PowerShell (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyser les scripts PowerShell
        shell: pwsh
        run: |
          $resultats = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error,Warning
          if ($resultats) {
            $resultats | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer a signalé $($resultats.Count) problème(s)."
            exit 1
          }
          Write-Host "Aucun problème détecté."
